<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tạo báo giá điện mặt trời</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('solar-theme')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef4ef;--bg2:#e3ece6;--card:#fff;--line:#d3e0d7;--ink:#10231a;--mute:#5d776a;--green:#15803d;--greenbg:#d9f5e3;--blue:#2563eb;--gold:#9a6a00;--goldbg:#fdf0d0;--chip:#eef4ef;--chipink:#10231a;--bad:#d1342b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1510;--bg2:#0f1f17;--card:#11241b;--line:#20382c;--ink:#e8f3ec;--mute:#8aa598;--green:#4ade80;--greenbg:#1d4d33;--blue:#3b6cff;--gold:#e9b949;--goldbg:#3a3015;--chip:#fff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1510;--bg2:#0f1f17;--card:#11241b;--line:#20382c;--ink:#e8f3ec;--mute:#8aa598;--green:#4ade80;--greenbg:#1d4d33;--blue:#3b6cff;--gold:#e9b949;--goldbg:#3a3015;--chip:#fff;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*:before,*:after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 'Be Vietnam Pro',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700}
.tabs{margin-left:auto;display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:99px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--green);color:var(--bg)}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:17px}
.app{max-width:1180px;margin:0 auto;padding:16px 16px 120px}
.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 12px}
.crow{display:flex;gap:10px;align-items:center}
.crow select{width:auto;border:1px solid var(--gold);background:var(--goldbg);color:var(--gold);border-radius:99px;padding:10px 14px;font-weight:700;font-size:17px}
.crow input.nm{flex:1;min-width:0;border:0;background:transparent;font-size:20px;font-weight:600;padding:8px 4px}
.crow2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:10px}
input.fld,.fld{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2)}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;color:var(--mute);font-size:14px;margin:0 4px 14px}
.stats b{color:var(--ink)}.stats .g{color:var(--green)}
.segs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.lab{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:0 0 6px 8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px}
.seg.off{opacity:.45;pointer-events:none}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:10px 4px;font-weight:600;color:var(--mute);line-height:1.15}
.seg button.on{color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.seg[data-k=ph] .on{background:var(--blue)}.seg[data-k=gr] .on{background:#1f9d4f}.seg[data-k=vo] .on{background:#0f9d8a}
.line{display:flex;align-items:center;gap:10px;padding:10px 2px;flex-wrap:wrap}
.line+.line{border-top:1px solid var(--line)}
.k{color:var(--mute)}.u{color:var(--mute)}
.big{font-size:28px;font-weight:700;line-height:1.1}
input.bill{flex:1;min-width:90px;border:0;background:transparent;font-size:28px;font-weight:700;padding:0}
.chip{border:0;border-radius:99px;padding:10px 16px;font-weight:700;background:var(--goldbg);color:var(--gold)}
.badge{margin-left:auto;background:var(--greenbg);color:var(--green);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
.tg{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 6px;color:var(--mute);font-weight:600;cursor:pointer}
.tg input{position:absolute;opacity:0}
.tg i{width:38px;height:22px;border-radius:99px;background:var(--bg2);position:relative;transition:.15s}
.tg i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--mute);transition:.15s}
.tg input:checked+i{background:var(--greenbg)}.tg input:checked+i:after{left:19px;background:var(--green)}
.tg input:focus-visible+i{outline:2px solid var(--green)}
input[type=range]{width:100%;accent-color:var(--green);height:30px;margin:6px 0 0}
.note{font-size:13px;color:var(--mute);margin:6px 2px 0}
.sh{display:flex;align-items:center;gap:10px;padding:6px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sh span{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mute);flex:1}
.sh b{font-size:20px}
.lnk{border:0;background:none;color:var(--green);font-size:13px;font-weight:600;padding:4px}
.it{display:grid;grid-template-columns:minmax(0,1.7fr) auto auto 78px 26px;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it.sv{grid-template-columns:minmax(0,1.7fr) auto auto 78px}
.pill{display:flex;align-items:center;gap:8px;background:var(--chip);color:var(--chipink);border-radius:14px;padding:6px 8px;min-width:0}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none;background:#fde5c4}
.pill.inv .ic{background:#d6e2ff}.pill.bat .ic{background:#d3f3de}.pill.ship .ic{background:#e2e8e4}
.pill select{flex:1;min-width:0;border:0;background:transparent;color:var(--chipink);font-weight:600;text-overflow:ellipsis;padding:6px 0}
.pill option{color:#10231a;background:#fff}
.spec{flex:none;border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(#fb923c,#f59e0b)}
.pill.inv .spec{background:linear-gradient(#4f7bff,#2f5be8)}.pill.bat .spec{background:linear-gradient(#34c06a,#1f9d4f)}.spec:empty{display:none}
.nm{font-weight:600}.nm small{color:var(--mute);font-weight:400}
.stp{display:flex;align-items:center;background:var(--bg2);border-radius:99px;height:40px;min-width:104px;justify-content:center}
.stp button{border:0;background:none;width:34px;height:40px;font-size:20px;color:var(--ink)}
.stp input{width:38px;border:0;background:transparent;text-align:center;font-weight:700;font-size:17px;padding:0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none}
.stp.auto{padding:0 14px;font-weight:700}
.pr{text-align:right}
.pv{border:0;background:none;color:var(--green);font-weight:700;font-size:16px;padding:4px 0;border-bottom:2px dotted var(--mute);white-space:nowrap}
input.pin{width:110px;padding:6px 8px;border:1px solid var(--green);border-radius:8px;background:var(--bg2);text-align:right}
.rs{display:block;margin-left:auto;border:0;background:none;color:var(--gold);font-size:12px;padding:2px 0}
.lt{text-align:right;font-weight:700;font-size:17px;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);font-size:22px;line-height:1;padding:0}
.add{display:inline-block;margin:10px 8px 4px 0;border:1.5px dashed var(--line);background:none;color:var(--green);border-radius:99px;padding:10px 18px;font-weight:700}
.km{min-width:0;padding:0 12px;gap:6px}.km input{width:54px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
label.l{font-size:13px;color:var(--mute);display:block;margin-bottom:4px}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-weight:500}.chk input{width:auto}
.res{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg2)}
.side{position:static}
.sum .l{display:flex;justify-content:space-between;gap:10px;padding:6px 0;color:var(--mute)}.sum .l b{color:var(--ink)}
.vin{width:52px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);margin:0 4px}
.tt{margin:10px 0;padding:14px;border-radius:14px;background:linear-gradient(135deg,#f97316,#f59e0b);color:#fff}
.tt small{display:block;font-weight:600;opacity:.9}.tt b{font-size:26px;line-height:1.2}
.btn{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:700;margin-top:8px}
.btn.go{background:var(--green);border-color:var(--green);color:var(--bg)}
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:12px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#f97316,#f59e0b);color:#fff;border-radius:22px 22px 0 0}
.mbar small{display:block;font-weight:600;font-size:12px}.mbar b{font-size:22px}.mbar>div{flex:1;min-width:0}
.mbar button{border:0;background:#fff;color:#c2410c;border-radius:14px;padding:13px 18px;font-weight:700}
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.sbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.sbar .btn{width:auto;margin:0;padding:9px 14px}.sp{flex:1}
.mseg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px}
.mseg button{border:0;background:none;border-radius:99px;padding:7px 14px;font-weight:600;color:var(--mute)}.mseg button.on{background:var(--green);color:var(--bg)}
.ah{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:10px}
.arow,.ahead{display:grid;grid-template-columns:3fr 1.4fr .8fr .9fr .9fr auto;gap:8px;align-items:center}
.arow{padding:6px 0;border-top:1px solid var(--line)}
.arow.s2{grid-template-columns:3fr 1.4fr auto}.arow.s3{grid-template-columns:3fr 1.4fr 1.2fr auto}
.arow.w,.ahead.w{grid-template-columns:3fr 1.4fr .9fr .8fr .9fr .9fr auto}
.ahead{font-size:12px;color:var(--mute)}
.arow input,.arow select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg2)}
.sticky{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.sticky .btn{width:auto;margin:0}
.paper{background:#fff;color:#111;max-width:830px;margin:16px auto;padding:28px;border-radius:8px;font:12px/1.45 'Be Vietnam Pro',Arial,sans-serif}
.paper h1{font-size:19px;margin:0}.paper h3{font-size:13px;margin:16px 0 6px;border-bottom:2px solid #e0a100;padding-bottom:3px}
.paper table{width:100%;border-collapse:collapse}.paper th,.paper td{border:1px solid #bbb;padding:5px 6px;text-align:left;vertical-align:top}
.paper th{background:#f0f0ea}.paper .r{text-align:right;white-space:nowrap}.paper .tt td{font-weight:700;background:#faf3dc}
.paper .meta{display:flex;justify-content:space-between;gap:20px;margin:6px 0}.paper .tag{border:1px solid #111;padding:1px 8px;border-radius:10px;font-size:11px}
.paper .up{color:#0a6b2d}.paper .dn{color:#b3261e}
@media (min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 350px}.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start}.mbar{display:none}.app{padding-bottom:40px}}
@media (max-width:640px){
 .segs{gap:6px}.seg button{font-size:13px;padding:9px 2px}.lab{margin-left:4px;font-size:10.5px}
 .it,.it.sv{grid-template-columns:auto 1fr auto;grid-template-areas:"p p x" "s r t"}
 .it>.pill,.it>.nm{grid-area:p}.it>.stp{grid-area:s}.it>.pr{grid-area:r}.it>.lt{grid-area:t}.it>.x{grid-area:x}
 .arow,.arow.s2,.arow.s3,.arow.w{grid-template-columns:1fr 1fr}.arow>:first-child{grid-column:1/-1}.ahead{display:none}
 .crow2{grid-template-columns:1fr}.big,input.bill{font-size:24px}}
/* ===== Giao diện mobile theo ảnh mẫu ===== */
.menu{display:none;position:relative}
.drop{position:absolute;left:0;top:46px;min-width:170px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.35);z-index:40}
.drop button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-radius:10px;font-weight:600}
.drop button.on{background:var(--greenbg);color:var(--green)}
.more{border:0;background:none;color:var(--green);font-weight:600;font-size:13px;padding:8px 4px 0}
.card:has(>.sh){background:none;border:0;padding:0;border-radius:0;margin-bottom:20px}
.sh{padding:8px 2px 10px}
.it{grid-template-columns:minmax(0,1fr) auto auto 62px 22px;grid-template-areas:"p s r t x" "c c c c c";gap:4px 8px;padding:10px 0}

.it>.pill,.it>.nm{grid-area:p}.it>.stp{grid-area:s}.it>.pr{grid-area:r}.it>.lt{grid-area:t}.it>.x{grid-area:x}.it>.cap{grid-area:c}

.pv{font-size:15px}.lt{font-size:16px}

.mbar b{font-size:24px;display:block}.mbar button{padding:14px 18px;border-radius:18px}
@media (min-width:641px){.it{gap:4px 14px}}
@media (max-width:640px){.menu{display:block}.tabs{display:none}.top{padding:10px 14px}.x{display:none}

 .stats{font-size:13px;gap:2px 14px}.ic{width:28px;height:28px;font-size:15px}.spec{padding:4px 7px;font-size:13px}
 .app{padding:14px 14px 130px}.card:not(:has(>.sh)){padding:14px;border-radius:20px}}

/* ===== Trả góp, PDF mobile ===== */
.ln{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer}
.ln input{position:absolute;opacity:0}

 .paper h1{font-size:15px}.paper h3{font-size:12px;margin-top:12px}.paper .meta{flex-direction:column;gap:6px}

 .ln{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-areas:"t m m" ". a b";gap:2px 10px;align-items:start}
 .ln i{grid-area:t}.ln .lm{grid-area:m}.ln .lp.a{grid-area:a}.ln .lp.b{grid-area:b}.ln .lp{text-align:left}

<body>
<header class="top"><div class="menu"><button class="ibtn" id="menuBtn" aria-label="Menu">☰</button><div class="drop" id="drop" hidden><button data-view="quote">Báo giá</button><button data-view="admin">Quản trị</button></div></div><div class="brand">Tạo báo giá</div>
  <nav class="tabs"><button data-view="quote">Báo giá</button><button data-view="admin">Quản trị</button></nav>
  <button class="ibtn" id="theme" aria-label="Đổi sáng tối">◐</button></header>
<main class="app">
<div id="vq" class="layout">
 <div class="main">
  <section class="card">
    <div class="crow"><select id="ti" aria-label="Xưng hô"><option>Anh</option><option>Chị</option><option>Cô</option><option>Chú</option><option>Công ty</option></select><input class="nm" id="cn" placeholder="Tên khách hàng"></div>
    <button class="more" id="moreBtn">+ Số điện thoại, địa chỉ</button><div class="crow2" id="moreBox" hidden><input class="fld" id="cp" inputmode="tel" placeholder="Số điện thoại"><input class="fld" id="ca" placeholder="Địa chỉ lắp đặt"></div>
  </section>
  <div class="stats"><span>Tiết kiệm <b class="g" id="sv">—</b>/tháng</span><span>Hoàn vốn <b id="pb">—</b></span><span>Mái <b id="rf">—</b></span></div>
  <div class="segs">
    <div><div class="lab">Điện lưới</div><div class="seg" data-k="ph"><button data-v="1">1 pha</button><button data-v="3">3 pha</button></div></div>
    <div><div class="lab">Loại hệ</div><div class="seg" data-k="gr"><button data-v="g">Hòa lưới</button><button data-v="h">Hybrid</button></div></div>
    <div><div class="lab">Điện áp pin</div><div class="seg" data-k="vo"><button data-v="l">Áp thấp</button><button data-v="h">Áp cao</button></div></div>
  </div>
  <section class="card">
    <div class="line"><span class="k">Tiền điện</span><input class="bill" id="bill" inputmode="numeric" aria-label="Tiền điện mỗi tháng"><span class="u">đ/tháng</span><button class="chip" id="sug">⚡ Gợi ý</button></div>
    <div class="line"><span class="k">Công suất</span><b class="big" id="kwv">0</b><span class="u">kWp</span><span class="badge" id="size"></span><label class="tg" id="pinw"><input type="checkbox" id="pin"><i></i><span>Pin</span></label></div>
    <input type="range" id="sl" min="1" max="30" step="0.1" aria-label="Công suất hệ thống">
    <div class="note" id="capn"></div>
  </section>
  <section class="card">
    <div class="sh"><span>Thiết bị chính</span><button class="lnk" id="resetAll">↺ Tất cả về giá hệ thống</button><b id="subM">0</b></div>
    <div id="mat"></div>
  </section>
  <section class="card">
    <div class="sh"><span>Thi công &amp; dịch vụ</span><b id="subS">0</b></div>

    <div class="it sv">
      <div class="pill ship"><span class="ic">🚚</span><span class="brand" id="zlab"></span><span class="cv">⌄</span><select id="zone" aria-label="Khu vực vận chuyển"></select></div>
      <div class="stp km"><input id="km" type="number" min="0" value="0" inputmode="numeric" aria-label="Số km"><span>km</span></div>
      <div class="pr" id="zrw"></div><div class="lt" id="zt">0</div>
    </div>
  </section>
  <section class="card">
    <h2>Phương án trả góp</h2>
    <div style="display:flex;gap:14px;margin:-4px 0 4px"><button class="lnk" id="lAll">Bật tất cả</button><button class="lnk" id="lNone">Tắt tất cả</button></div>
    <div class="grid">
      <div><label class="l" for="ld">Tỷ lệ vay mong muốn (%)</label><input class="fld" id="ld" type="number" min="1" max="100" placeholder="Tối đa theo từng đơn vị"></div>
      <div><label class="l" for="lt">Kỳ hạn vay</label><select class="fld" id="lt"><option value="12">12 tháng (1 năm)</option><option value="24">24 tháng (2 năm)</option><option value="36" selected>36 tháng (3 năm)</option><option value="48">48 tháng (4 năm)</option><option value="60">60 tháng (5 năm)</option><option value="84">84 tháng (7 năm)</option><option value="96">96 tháng (8 năm)</option><option value="120">120 tháng (10 năm)</option><option value="180">180 tháng (15 năm)</option><option value="240">240 tháng (20 năm)</option></select></div>
    </div>
    <div id="ins"></div>
  </section>
 </div>
 <aside class="side"><div class="card sum">
   <h2>Tổng hợp</h2>
   <div class="l"><span>Thiết bị chính</span><b id="s1"></b></div>
   <div class="l"><span>Thi công &amp; dịch vụ</span><b id="s2"></b></div>
   <div class="l"><span>Vận chuyển</span><b id="s3"></b></div>
   <div class="l"><span>Tạm tính</span><b id="s4"></b></div>
   <div class="l"><span>VAT<input class="vin" id="vat" type="number" min="0" step="0.5" aria-label="VAT phần trăm">%</span><b id="s5"></b></div>
   <div class="tt"><small>Tổng sau thuế</small><b id="grand"></b></div>
   <div class="l" id="sIns" hidden></div>
   <button class="btn go" id="pc">Xem bản in</button>
   <button class="btn" id="pi">Bản nội bộ</button>
 </div></aside>
</div>

<div id="va" hidden>
  <p class="note" style="margin:0 0 10px" id="perm"></p>
  <div id="admin"></div>
  <div class="sticky"><button class="btn go" id="save">Lưu thay đổi</button><span id="st"></span></div>
</div>
</main>
<div class="mbar" id="mbar"><div><small>Tổng sau thuế</small><b id="grand2"></b></div><button id="pc2">↗ Xem bản in</button></div>
<div id="sheet" hidden>
  <div class="sbar"><div class="mseg"><button data-m="customer">Khách hàng</button><button data-m="internal">Nội bộ</button></div><span class="sp"></span><span class="note" id="phint"></span><button class="btn go" id="doPrint">In / Lưu PDF</button><button class="btn" id="closeSheet">Đóng</button></div>
  <div id="print" class="paper"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const nf=(n,d=2)=>(+n||0).toLocaleString('vi-VN',{maximumFractionDigits:d});
const dots=n=>{n=Math.round(+n||0);return (n<0?'-':'')+String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
const undot=v=>+String(v||'').replace(/\D/g,'')||0;
const fmt=n=>dots(n)+' đ';
const sh=n=>{n=Math.round(n||0);if(!n)return '0';return Math.abs(n)>=1e6?nf(n/1e6,1)+' tr':nf(n/1e3,1)+' k';};
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.money!==undefined){const p=t.selectionStart||0,l=t.value.length,n=undot(t.value);t.value=n?dots(n):'';const q=Math.max(0,p+t.value.length-l);try{t.setSelectionRange(q,q);}catch(x){}}},true);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P=(a,ph,g,v)=>a.map(x=>({n:x[0],p:x[1],ph:x[2]||ph||'',g:x[3]||g||'',v:x[4]||v||'',w:x[5]||0}));
const DEFCALC={kwh:120,price:2500,m2lo:3.4,m2hi:4,small:5,mid:15,vat:0};
let CFG={
 co:{name:'CÔNG TY ĐIỆN NĂNG LƯỢNG MẶT TRỜI',phone:'',addr:'',note:'Báo giá có hiệu lực 7 ngày kể từ ngày lập.'},
 calc:{...DEFCALC},
 cats:[
  {id:'panel',title:'Tấm pin',auto:1,qty:10,watt:1,items:P([['Jinko Tiger Neo 620W',2900000,'','','',620],['Longi Hi-MO 6 585W',2750000,'','','',585],['Trina Vertex 590W',2700000,'','','',590],['Canadian Solar 580W',2650000,'','','',580],['JA Solar 575W',2600000,'','','',575]])},
  {id:'inv',title:'Biến tần',auto:1,qty:1,watt:0,items:P([
   ['Growatt 5kW',12500000,'1','g'],['Huawei SUN2000-5KTL',15500000,'1','g'],['Sungrow SG5.0RS',14000000,'1','g'],
   ['Growatt 10kW',21000000,'3','g'],['Huawei SUN2000-10KTL',26000000,'3','g'],['Sungrow SG10RT',23500000,'3','g'],
   ['Deye SUN-5K-SG hybrid',28000000,'1','h'],['Growatt SPH5000 hybrid',30000000,'1','h'],['Sungrow SH5.0RS hybrid',34000000,'1','h'],
   ['Deye SUN-10K-SG hybrid',48000000,'3','h'],['Growatt SPH10000 hybrid',52000000,'3','h'],['Sungrow SH10RT hybrid',58000000,'3','h']])},
  {id:'bat',title:'Pin lưu trữ',auto:0,qty:1,watt:0,items:P([['Pylontech US5000 4.8kWh',22000000,'','','l'],['Deye SE-G5.1 Pro 5.12kWh',21000000,'','','l'],['Dyness Powerbrick 14.3kWh',52000000,'','','l'],
   ['Deye RW-M6.1 6.14kWh',30000000,'','','h'],['Sungrow SBR128 12.8kWh',78000000,'','','h'],['Huawei LUNA2000 10kWh',85000000,'','','h']])}],
 svc:[{k:'Tủ điện',p:0,u:''},{k:'Vật tư phụ (dây, giá đỡ, ống, thiết bị bảo vệ)',p:0,u:''},{k:'Lắp đặt',p:0,u:'kWp'}],
 zones:[{n:'Nội thành Hà Nội',r:10000},{n:'Ngoại thành Hà Nội',r:12000},{n:'Các tỉnh miền Bắc',r:14000},{n:'Miền Trung',r:16000},{n:'Miền Nam',r:18000}],
 lenders:[{n:'VPBank',lm:80,rates:[8,10,12],mx:84},{n:'Techcombank',lm:80,rates:[9,11],mx:84},{n:'TPBank',lm:70,rates:[10,12],mx:60},{n:'FE Credit',lm:70,rates:[24],mx:48},{n:'Home Credit',lm:70,rates:[28],mx:48},{n:'Quỹ / đơn vị khác',lm:70,rates:[15],mx:60}]};
const TPL={items:()=>({n:'Sản phẩm mới',p:0,ph:'',g:'',v:'',w:0}),svc:()=>({k:'Hạng mục mới',p:0,u:''}),zones:()=>({n:'Khu vực mới',r:0}),lenders:()=>({n:'Đơn vị mới',lm:80,rates:[12],mx:60}),cats:()=>({id:'c'+Date.now(),title:'Nhóm vật tư mới',auto:0,qty:1,watt:0,items:[]})};

/* ===== Trạng thái ===== */
const S={ph:'1',gr:'g',vo:'l',bill:2500000,items:[],svc:[],zr:0,km:0,vat:0,vatT:0};let uid=0;
const cat=id=>CFG.cats.find(c=>c.id===id);
const match=o=>(!o.ph||o.ph===S.ph)&&(!o.g||o.g===S.gr)&&(!o.v||o.v===S.vo);
const opts=id=>(cat(id)?.items||[]).filter(match);
const pinOn=()=>S.items.some(i=>i.c==='bat');
const wcat=()=>CFG.cats.find(c=>c.watt);
const wOf=i=>+(wcat()?.items.find(o=>o.n===i.n)?.w)||0;
const curKw=()=>{const c=wcat();return c?S.items.filter(i=>i.c===c.id).reduce((a,i)=>a+i.qty*wOf(i),0)/1000:0;};
let msg='';
function addItem(id,qty){const o=opts(id)[0];if(!o){msg='Chưa có sản phẩm phù hợp cấu hình này. Thêm trong tab Quản trị.';return;}
  S.items.push({id:++uid,c:id,n:o.n,base:o.p,price:o.p,qty:qty||cat(id).qty||1});}
function ensurePin(){if(cat('bat')&&!pinOn())addItem('bat',1);}
function fix(){
  S.items=S.items.filter(i=>cat(i.c));
  S.items.forEach(i=>{const l=opts(i.c),o=l.find(x=>x.n===i.n);
    if(o){if(i.price===i.base)i.price=o.p;i.base=o.p;}else if(l[0]){i.n=l[0].n;i.base=i.price=l[0].p;}else i.dead=1;});
  S.items=S.items.filter(i=>!i.dead);
  CFG.cats.forEach(c=>{if((+c.auto||0)>0&&!S.items.some(i=>i.c===c.id))for(let k=0;k<Math.min(+c.auto,5);k++)addItem(c.id);});
}
const ICON={panel:'☀️',inv:'⚡',bat:'🔋'};
function spec(c,o){if(c.watt&&o.w)return o.w+' W';const m=/(\d+(?:[.,]\d+)?)\s*(kWh|kW|W)\b/i.exec(o.n||'');return m?m[1]+' '+m[2]:'';}
const stp=i=>`<div class="stp"><button data-act="dec" aria-label="Giảm">−</button><input data-f="qty" inputmode="numeric" value="${i.qty}" aria-label="Số lượng"><button data-act="inc" aria-label="Tăng">+</button></div>`;
const prc=i=>`<div class="pr"><button class="pv" data-edit title="Sửa đơn giá">× ${sh(i.price)}</button></div>`;
const rst=i=>i.price!==i.base?'<button class="rs" data-reset>↺ Giá hệ thống</button>':'';
const brand=n=>String(n).split(' ')[0];
function renderMat(){
  let h='';
  CFG.cats.forEach(c=>{
    S.items.filter(i=>i.c===c.id).forEach(i=>{const o=c.items.find(x=>x.n===i.n)||{n:i.n};
      h+=`<div class="it" data-id="${i.id}" data-l="i"><div class="pill ${esc(c.id)}"><span class="ic">${ICON[c.id]||'📦'}</span><span class="brand">${esc(brand(i.n))}</span><span class="spec">${esc(spec(c,o))}</span><span class="cv">⌄</span><select data-f="n" aria-label="${esc(c.title)}">${opts(c.id).map(x=>`<option ${x.n===i.n?'selected':''}>${esc(x.n)}</option>`).join('')}</select></div>${stp(i)}${prc(i)}<div class="lt" data-t></div><button class="x" data-del aria-label="Xóa dòng">×</button><div class="cap"><span>${esc(i.n)}</span>${rst(i)}</div></div>`;});
    h+=`<button class="add" data-add="${esc(c.id)}">+ ${esc(c.title)}</button>`;});
  $('#mat').innerHTML=h;
  $('#svc').innerHTML=S.svc.map(s=>`<div class="it sv" data-id="${s.id}" data-l="s"><div class="nm">${esc(s.k)}${s.u?` <small>(theo ${esc(s.u)})</small>`:''}</div>${s.u?`<div class="stp auto"><span data-auto>${nf(s.qty,1)} ${s.u==='kWp'?'kW':esc(s.u)}</span></div>`:stp(s)}${prc(s)}<div class="lt" data-t></div>${rst(s)?`<div class="cap"><span></span>${rst(s)}</div>`:''}</div>`).join('');
}
function updateZr(){$('#zlab').textContent=CFG.zones[$('#zone').value]?.n||'';$('#zrw').innerHTML=`<button class="pv" data-edit="zr" title="Sửa giá mỗi km">× ${sh(S.zr)}/km</button>`;}
const pmt=(L,a,n)=>{const r=a/1200;return r?L*r/(1-Math.pow(1+r,-n)):L/n;};
function totals(){
  const cur=curKw();S.svc.forEach(s=>{if(s.u==='kWp')s.qty=Math.round(cur*10)/10;});
  const mat=S.items.reduce((a,i)=>a+i.price*i.qty,0),sv=S.svc.reduce((a,s)=>a+s.price*s.qty,0),ship=S.zr*S.km,sub=mat+sv+ship,vat=sub*S.vat/100;
  return{cur,mat,sv,ship,sub,vat,grand:sub+vat};
}
function sched(L,n,rates){const mp=Math.round(L/n);let bal=L,int=0;const years=[];
  for(let y=0;y*12<n;y++){const m=Math.min(12,n-y*12),ra=+rates[Math.min(y,rates.length-1)]||0,fee=Math.round(bal*ra/1200);
    years.push({y:y+1,m,prin:mp,fee,pay:mp+fee,ra});int+=fee*m;bal-=L/n*m;}
  return{years,int,total:L+int,first:years[0].pay};}
const ratesTxt=r=>(r.every(v=>v===r[0])?nf(r[0])+'%/năm':r.map((v,i)=>`N${i+1}${i===r.length-1?'+':''}: ${nf(v)}%`).join(' · '));
function insInfo(){const t=totals(),n=+$('#lt').value,want=+$('#ld').value||0;
  const list=CFG.lenders.map(x=>{const rates=(x.rates&&x.rates.length?x.rates:[12]).map(Number),mxp=Math.min(100,+x.lm||80),pct=want>0?Math.min(want,mxp):mxp,mx=+x.mx||60,loan=Math.round(t.grand*pct/100),ok=n<=mx&&loan>0;
    return{name:x.n,rates,on:!!S.lon[x.n],ok,pct,loan,pre:t.grand-loan,mx,s:ok?sched(loan,n,rates):null};});
  return{n,total:t.grand,list};}
function loanTable(x){const s=x.s;return `<table class="lt2"><tr><th>Năm</th><th class="r">Gốc/tháng (1)</th><th class="r">Phí quản lý/tháng (2)</th><th class="r">Tổng thanh toán/tháng (3=1+2)</th></tr>`+
  s.years.map(y=>`<tr><td>${y.y}${y.m<12?` (${y.m} th)`:''}</td><td class="r">${dots(y.prin)}</td><td class="r">${dots(y.fee)}</td><td class="r">${dots(y.pay)}</td></tr>`).join('')+
  `<tr class="sum"><td>Tổng cả kỳ</td><td class="r">${dots(x.loan)}</td><td class="r">${dots(s.int)}</td><td class="r">${dots(s.total)}</td></tr></table>`;}
function renderIns(){const a=insInfo(),sel=a.list.filter(x=>x.on&&x.ok);
  $('#ins').innerHTML=`<div class="note" style="margin:0 0 4px">Giá trị báo giá ${fmt(a.total)} · kỳ hạn ${a.n} tháng (${nf(a.n/12,1)} năm). Bật phương án nào thì phương án đó được đưa vào bản in.</div>`+
   a.list.map((x,i)=>`<label class="ln"><input type="checkbox" data-lon="${i}" ${x.on?'checked':''}><i></i><div class="lm"><b>${esc(x.name)}</b><small>Vay ${x.pct}% · ${esc(ratesTxt(x.rates))}</small></div>${x.ok?`<div class="lp a"><small>Trả trước ${nf(100-x.pct,1)}%</small><b>${fmt(x.pre)}</b></div><div class="lp b"><small>Hàng tháng${x.s.years.some(y=>y.pay!==x.s.first)?' (năm 1)':''}</small><b>${fmt(x.s.first)}</b></div>`:`<div class="lp"><small>${a.n>x.mx?'Tối đa '+x.mx+' tháng':'—'}</small></div>`}</label>${x.on&&x.ok?`<details class="dt"><summary>Xem bảng trả nợ từng năm</summary><div class="tw">${loanTable(x)}</div></details>`:''}`).join('');
  const si=$('#sIns');si.hidden=!sel.length;if(sel.length)si.innerHTML=`<span>Trả góp (${sel.length} phương án)</span><b>từ ${fmt(Math.min(...sel.map(x=>x.s.first)))}/th</b>`;}
function calc(){
  const t=totals(),c=CFG.calc;
  document.querySelectorAll('#vq [data-id]').forEach(r=>{const l=r.dataset.l==='s'?S.svc:S.items,i=l.find(x=>x.id==r.dataset.id);if(!i)return;
    const e=r.querySelector('[data-t]');e.textContent=sh(i.price*i.qty);e.title=fmt(i.price*i.qty);
    const a=r.querySelector('[data-auto]');if(a)a.textContent=nf(i.qty,1)+' '+(i.u==='kWp'?'kW':i.u);});
  $('#zt').textContent=sh(t.ship);$('#subM').textContent=sh(t.mat);$('#subS').textContent=sh(t.sv+t.ship);
  $('#s1').textContent=fmt(t.mat);$('#s2').textContent=fmt(t.sv);$('#s3').textContent=fmt(t.ship);$('#s4').textContent=fmt(t.sub);$('#s5').textContent=fmt(t.vat);
  $('#grand').textContent=$('#grand2').textContent=fmt(t.grand);
  // công suất

$('#menuBtn').onclick=e=>{e.stopPropagation();$('#drop').hidden=!$('#drop').hidden;};
document.addEventListener('click',()=>{$('#drop').hidden=true;});
$('#moreBtn').onclick=()=>{$('#moreBox').hidden=!$('#moreBox').hidden;};
$('#theme').onclick=()=>{const r=document.documentElement,n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('solar-theme',n);}catch(e){}};
function load(j){try{const c=JSON.parse(j);if(c&&c.cats&&c.svc&&c.zones&&c.lenders){
  c.calc={...DEFCALC,...(c.calc||{})};
  c.cats.forEach(x=>{if(x.watt===undefined){x.watt=x.id==='panel'?1:0;x.items.forEach(o=>{if(o.w===undefined){const m=/(\d{3,4})\s*W/i.exec(o.n);o.w=x.watt&&m?+m[1]:0;}});}});
  c.svc.forEach(s=>{if(s.u===undefined)s.u=/lắp đặt/i.test(s.k)?'kWp':'';});
  c.lenders.forEach(x=>{if(!x.rates)x.rates=[+x.r||12];if(!x.mx)x.mx=60;if(!x.lm)x.lm=80;});CFG=c;return true;}}catch(e){}return false;}
try{const j=localStorage.getItem('solar-cfg');if(j)load(j);}catch(e){}
applyCfg();view();
(async()=>{
  try{
    if(!window.claude)return;
    DB=await claude.use('db');USER=await claude.use('user');
    if(USER&&USER.canEdit&&!USER.canEdit())$('#perm').textContent='Bạn chỉ có quyền xem. Cần quyền chỉnh sửa để lưu thay đổi.';
    if(DB)DB.collection('config').doc('main').onSnapshot(s=>{if(s.exists&&!dirty&&load(s.data().json)){applyCfg();if(location.hash==='#admin')renderAdmin();}},()=>{});
    else $('#perm').textContent='Chưa kết nối được kho dữ liệu chung: thay đổi chỉ lưu trên trình duyệt này.';
  }catch(e){}
})();
</script>
</body>
</html>
